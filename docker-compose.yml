services:
  db:
    image: postgres:13
    container_name: kaleidoskop_db
    restart: always
    env_file: ./.env
    ports:
      - 5432:5432
    volumes:
      - pg_data:/var/lib/postgresql/data

  minio:  
    image: minio/minio
    container_name: kaleidoskop_minio
    restart: unless-stopped  
    ports:
      - 9000:9000
      - 9001:9001
    expose:
      - "9000"
    volumes:  
      - minio-storage:/data  
    environment:  
      - MINIO_ROOT_USER=miniouser  
      - MINIO_ROOT_PASSWORD=admin123
    command: server /data --console-address ":9001"  
    healthcheck:  
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]  
      interval: 30s  
      timeout: 20s  
      retries: 3
  
  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: kaleidoskop_rabbitmq
    ports:
      - 15672:15672
      - 5672:5672
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: always
    healthcheck:
        test: rabbitmq-diagnostics -q ping
        interval: 10s
        timeout: 10s
        retries: 5
    # network_mode: "host"
  
  app:
    build: ./kaleidoskop/
    container_name: main_app
    # ports:
    #   - 8080:8000
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      - CONTAINER_LAUNCH=true
    volumes:
      - static:/static/
    extra_hosts:
      - "host.docker.internal:host-gateway"

  celery:
    build: ./kaleidoskop/
    container_name: celery_worker_kaleidoskop
    restart: always
    environment:
      - CONTAINER_LAUNCH=true
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    command: celery -A kaleidoskop worker -l INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"

  elasticsearch:
    image: elasticsearch:8.17.10
    ports:
      - 9200:9200
      - 9300:9300
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=MyPassword
      - ES_JAVA_OPTS=-Xms2g
    volumes:
      - es-data:/usr/share/elasticsearch/data

  redis:
    image: redis
    container_name: redis
    restart: unless-stopped
    env_file:
      - .env
    # network_mode: "host"
    volumes:
        - ./redis/data:/data
        - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - 6379:6379
    command: redis-server /usr/local/etc/redis/redis.conf

  nginx:
    build: ./nginx
    container_name: nginx
    ports:
      - 443:443
      - 8080:8080
    depends_on:
      - app
    volumes:
      - static:/static/
      - frontend_static:/frontend_static/

  telegram_bot:
    build: ./Telegram_Notification
    container_name: telegram
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    command: python bot.py
    # profiles: [donotstart]
  
  recommendation_system:
    build: ./AI_Feature
    container_name: ai_web_app
    ports:
      - 8082:8000
    command: uvicorn app.main_hybrid:app --reload --host 0.0.0.0 --port 8000
    volumes:
      - indexes:/code/indexes/
      - cache:/root/.cache/
    # command: python main_hybrid.py
    # profiles: [donotstart]

  frontend:
    image: wedyzza/kaleidoskop_frontend:latest
    command: cp -r /app/dist/. /frontend_static/
    container_name: frontend_client
    volumes:
      - frontend_static:/frontend_static/
  
volumes:
 pg_data:
 minio-storage:
 static:
 indexes:
 cache:
 es-data:
 frontend_static: